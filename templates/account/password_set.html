{% extends "base.html" %}

{% block title %}Установка пароля · Дневник тренировок{% endblock %}

{% block main_class %}app-main-narrow{% endblock %}

{% block content %}
<h1 class="app-page-title">Установка пароля</h1>

<div class="app-card p-4">
  <form method="post" action="{% url 'account_set_password' %}" novalidate>
    {% csrf_token %}
    {% include "includes/form.html" %}
    {{ redirect_field }}
    <button type="submit" class="btn btn-accent w-100">Сохранить пароль</button>
  </form>
</div>
{% endblock %}
