{% comment %}Настройка отдыха по умолчанию: каждый тап сохраняется сразу.{% endcomment %}
<div class="app-modal-backdrop" x-data @keydown.escape.window="$root.remove()">
  <div class="app-card app-modal" role="dialog" aria-modal="true" aria-labelledby="rest-modal-title">
    <div class="app-modal-head">
      <h2 class="app-modal-title" id="rest-modal-title">Отдых между подходами</h2>
      <button type="button" class="app-icon-btn" aria-label="Закрыть" @click="$root.remove()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <p class="text-secondary-app">Значение по умолчанию для таймера живого режима.</p>

    <div class="app-stepper">
      <button type="button" class="app-stepper-btn" aria-label="Минус 15 секунд"
              hx-post="{% url 'profile_rest' %}" hx-vals='{"delta": "-15"}'
              hx-swap="none" hx-sync="closest .app-stepper:queue all">−15</button>
      {% include "accounts/_rest_value.html" %}
      <button type="button" class="app-stepper-btn" aria-label="Плюс 15 секунд"
              hx-post="{% url 'profile_rest' %}" hx-vals='{"delta": "15"}'
              hx-swap="none" hx-sync="closest .app-stepper:queue all">+15</button>
    </div>

    <button type="button" class="btn btn-accent w-100 mt-3" @click="$root.remove()">Готово</button>
  </div>
</div>
