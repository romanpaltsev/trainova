{% extends "base.html" %}

{% block title %}Дашборд · Дневник тренировок{% endblock %}

{% block content %}
<h1 class="app-page-title">Дашборд</h1>

<div class="app-card p-4">
  <p class="mb-1">Вы вошли как <strong>{{ user.email }}</strong>.</p>
  <p class="text-secondary-app mb-3">
    Статистика, графики и запись тренировок появятся на следующих этапах.
  </p>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-quiet" href="{% url 'account_change_password' %}">Сменить пароль</a>
    <form method="post" action="{% url 'account_logout' %}" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-quiet">Выйти</button>
    </form>
  </div>
</div>
{% endblock %}
