{% comment %}
  Шапка страницы раздела: «назад» и заголовок. back — имя маршрута, куда
  вести: с главной раздела — в профиль (оттуда в неё входят на телефоне),
  с сервисов — на главную раздела.
{% endcomment %}
<div class="app-screen-head">
  <a class="app-icon-btn" href="{% url back %}" aria-label="Назад">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <h1 class="app-page-title mb-0">{{ title }}</h1>
</div>
