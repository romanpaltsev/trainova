# Конфиг для СИСТЕМНОГО nginx на VDS (не для контейнера).
#
# Установка:
#   sudo cp deploy/nginx/trainova.hotbar.pro.conf /etc/nginx/sites-available/trainova.hotbar.pro
#   sudo ln -s /etc/nginx/sites-available/trainova.hotbar.pro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Блок TLS дописывает certbot: `sudo certbot --nginx -d trainova.hotbar.pro`
# добавит listen 443, пути к сертификату и редирект с 80. Поэтому здесь только
# HTTP-сервер — иначе certbot не сможет дописать свой блок.
#
# На сервере есть catch-all заглушка (`listen 80 default_server; server_name _;
# return 444;`) — она нашему домену не мешает: nginx сначала ищет точное
# совпадение server_name и только потом падает в default_server. Именно поэтому
# здесь НЕ должно быть default_server: иначе мы перехватим чужие домены.

server {
    listen 80;
    listen [::]:80;
    server_name trainova.hotbar.pro;

    client_max_body_size 4m;

    # Статику отдаёт whitenoise внутри приложения (имена файлов с хэшем и
    # готовые .br/.gz копии), поэтому отдельного location для /static/ нет.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        # Порт из WEB_PORT в .env.prod: контейнер слушает только localhost.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Без этого заголовка Django считает запрос HTTP и ломает CSRF на HTTPS-домене.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
