# Прод-стек для одного VDS: gunicorn и postgres в докере, фронт — системный nginx.
#
# Наружу приложение не публикуется: порт слушает только localhost, а TLS,
# сертификаты и раздачу другим сайтам на этом сервере берёт на себя системный
# nginx (deploy/nginx/trainova.conf) с системным certbot.

# Своё имя проекта: иначе в одном каталоге прод-стек переиспользовал бы тома
# dev-стека (trainova_pgdata) и падал бы на несовпадении пароля базы.
name: trainova-prod

services:
  web:
    build: .
    env_file: .env.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Только localhost: снаружи порт недоступен, ходит лишь nginx с этой же машины.
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
