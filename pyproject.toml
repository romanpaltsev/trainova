[project]
name = "trainova"
# Поле для uv, а не версия продукта: та считается деплоем (config/version.py).
version = "0.1.0"
description = "Дневник тренировок — веб-приложение для записи силовых и кардио-тренировок"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-allauth>=65.0",
    "django-environ>=0.12",
    "gunicorn>=23.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "whitenoise[brotli]>=6.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.9",
    "django-debug-toolbar>=7.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
# -n 4: набор идёт в четыре процесса (pytest-xdist), у каждого своя тестовая база.
# Четыре — замеренный предел: дальше время упирается в создание баз, а у раннера
# GitHub как раз четыре ядра. Для отладки с --pdb или print — запуск с -n0.
addopts = "--reuse-db -n 4"
